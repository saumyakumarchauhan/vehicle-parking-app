<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('/static/car.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            padding: 40px;
            max-width: 600px;
            margin: 60px auto;
            color: #fff;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            box-shadow: none;
        }

        label {
            margin-top: 10px;
        }

        .btn-custom {
            background-color: #00bcd4;
            border: none;
            margin-top: 20px;
        }

        .btn-custom:hover {
            background-color: #0097a7;
        }

        .profile-img {
            display: block;
            margin: 0 auto 15px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .image-options {
            display: none;
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            border-radius: 10px;
            padding: 8px;
            z-index: 100;
        }

        .image-options button {
            display: block;
            width: 100%;
            background: transparent;
            color: white;
            border: none;
            padding: 6px 12px;
            text-align: left;
            cursor: pointer;
        }

        .image-options button:hover {
            background: rgba(255,255,255,0.1);
        }

        .profile-image-container {
            position: relative;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h3 class="text-center mb-4">Edit Profile</h3>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
          <div class="mt-3">
            {% for category, msg in messages %}
              <div class="alert alert-{{ 'warning' if category == 'message' else category }} alert-dismissible fade show auto-dismiss" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
        {% endwith %}

        <!-- Profile Form -->
        <form method="POST" enctype="multipart/form-data">
            <div class="profile-image-container">
                <!-- Profile Image Preview -->
                <img id="profilePreview"
                     src="{{ url_for('static', filename='uploads/' ~ (current_user.profile_image or 'default_profile.jpg')) }}"
                     alt="Profile Image"
                     class="profile-img" />

                <!-- Hidden File Input -->
                <input type="file" id="profileImageInput" name="profile_image" accept="image/*" style="display:none;">

                <!-- Options Menu -->
                <div id="imageOptions" class="image-options">
                    <button type="button" id="changeImageBtn">Change Image</button>
                    <button type="button" id="removeImageBtn">Remove Image</button>
                </div>
            </div>

            <!-- Other Profile Fields -->
            <div class="form-group mt-3">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ current_user.full_name }}" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label>Address</label>
                <input type="text" name="address" value="{{ current_user.address }}" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label>Pincode</label>
                <input type="text" name="pincode" value="{{ current_user.pincode }}" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label>Email</label>
                <input type="email" name="email" value="{{ current_user.email }}" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label>Old Password</label>
                <input type="password" name="old_password" class="form-control">
            </div>

            <div class="form-group mt-2">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control">
            </div>

            <button type="submit" class="btn btn-success mt-3">Save Changes</button>
        </form>

        <!-- Hidden form for remove image -->
        <form id="removeImageForm" method="POST" action="{{ url_for('dashboard.remove_profile_image') }}" style="display:none;"></form>
    </div>

    <!-- JavaScript -->
    <script>
      const profilePreview = document.getElementById("profilePreview");
      const imageOptions = document.getElementById("imageOptions");
      const profileImageInput = document.getElementById("profileImageInput");
      const changeImageBtn = document.getElementById("changeImageBtn");
      const removeImageBtn = document.getElementById("removeImageBtn");
      const removeImageForm = document.getElementById("removeImageForm");

      // Toggle menu when clicking profile image
      profilePreview.addEventListener("click", (e) => {
          e.preventDefault();
          imageOptions.style.display = imageOptions.style.display === "block" ? "none" : "block";
      });

      // Change image → open file picker
      changeImageBtn.addEventListener("click", () => {
          profileImageInput.click();
      });

      // Auto-submit when new image selected
      profileImageInput.addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = (e) => {
                  profilePreview.src = e.target.result; // show preview immediately
              };
              reader.readAsDataURL(file);

              // Submit the form automatically after selecting image
              setTimeout(() => {
                  profileImageInput.closest("form").submit();
              }, 500);
          }
      });

      // Remove image → submit hidden form
      removeImageBtn.addEventListener("click", () => {
          if (confirm("Are you sure you want to remove your profile image?")) {
              removeImageForm.submit();
          }
      });

      // Close menu when clicking outside
      window.addEventListener("click", (e) => {
          if (!profilePreview.contains(e.target) && !imageOptions.contains(e.target)) {
              imageOptions.style.display = "none";
          }
      });
    </script>

    <script>
      // Auto-dismiss flash messages after 3 seconds
      setTimeout(function () {
        const alerts = document.querySelectorAll('.alert.auto-dismiss');
        alerts.forEach(function(alert) {
          alert.classList.remove('show'); // fade out
          setTimeout(() => alert.remove(), 200); // remove after transition
        });
      }, 3000);
    </script>

</body>
</html>
